<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; cursor: pointer; }
      #messages { list-style-type: none; margin: 0; padding: 0; margin-bottom: 40px }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #nombre, #m { display: inline-block;}
      #m {width: 69%; margin-right: 4px;}
      #nombre {width: 20%}
      img, video, iframe { border-radius: 4px; }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>

    <form action="">
      <input id="nombre" autocomplete="off" placeholder="Username"/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" />
      <button>Send</button>
    </form>

    <!-- Librerías -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>

    <!-- Clasificador seguro (creado por ti en public/js/classify.js) -->
    <script src="/js/classify.js"></script>

    <!-- Código de la app -->
    <script>
      var colorHexTxt = "";

      // genera colores aleatorios en hexadecimal
      function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
      }

      $(function () {
        var socket = io();

        // Enviar mensaje
        $('form').submit(function(){
          var nombreTxt = $('#nombre').val() || "Anonimo";
          var mensajeTxt = $('#m').val();

          if (colorHexTxt === "") {
            colorHexTxt = getRandomColor();
          }

          var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
          socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
          $('#m').val('');
          return false;
        });

        // Recibir y renderizar mensaje de forma SEGURA
        socket.on('Evento-Mensaje-Server', function(msg){
          var msgJson = JSON.parse(msg);

          // Contenedor del item
          var $li = $('<li>');

          // Remitente
          var $nombre = $('<b>')
            .css('color', msgJson.color)
            .text(msgJson.nombre + ': ');
          $li.append($nombre);

          // Clasificar contenido del mensaje
          var c = window.ChatClassifier.classify(msgJson.mensaje);

          if (c.type === 'image') {
            $li.append(
              $('<img>')
                .attr('src', c.url)
                .attr('alt', '')
                .attr('loading', 'lazy')
                .css({ maxWidth: '260px', display: 'block', marginTop: '4px' })
                .on('error', function(){
                  $(this).replaceWith($('<a>').attr('href', c.url).attr('target','_blank').text(c.url));
                })
            );
          } else if (c.type === 'video' && c.kind === 'file') {
            $li.append(
              $('<video controls preload="metadata" playsinline>')
                .attr('src', c.src)
                .css({ maxWidth: '320px', display: 'block', marginTop: '4px' })
            );
          } else if (c.type === 'video' && c.kind === 'youtube') {
            $li.append(
              $('<iframe>')
                .attr('src', 'https://www.youtube-nocookie.com/embed/' + c.id)
                .attr('loading', 'lazy')
                .attr('allowfullscreen', true)
                .attr('sandbox', 'allow-scripts allow-same-origin allow-presentation')
                .css({ width: '320px', height: '200px', border: 'none', display: 'block', marginTop: '4px' })
            );
          } else if (c.type === 'video' && c.kind === 'vimeo') {
            $li.append(
              $('<iframe>')
                .attr('src', 'https://player.vimeo.com/video/' + c.id)
                .attr('loading', 'lazy')
                .attr('allowfullscreen', true)
                .attr('sandbox', 'allow-scripts allow-same-origin allow-presentation')
                .css({ width: '320px', height: '200px', border: 'none', display: 'block', marginTop: '4px' })
            );
          } else if (c.type === 'link') {
            $li.append(
              $('<a>')
                .attr('href', c.url)
                .attr('target', '_blank')
                .text(c.url)
            );
          } else {
            // Texto plano escapado (sin innerHTML)
            $li.append(window.ChatClassifier.escapeAngles(c.text));
          }

          $('#messages').append($li);
          window.scrollTo(0, document.body.scrollHeight);
        });

      });
    </script>
  </body>
</html>
